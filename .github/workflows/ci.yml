name: NourishBot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nourishbot_test
          POSTGRES_USER: nourishbot
          POSTGRES_PASSWORD: nourishbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nourishbot -d nourishbot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://nourishbot:nourishbot@127.0.0.1:5432/nourishbot_test
      DATABASE_URL_SYNC: postgresql+psycopg2://nourishbot:nourishbot@127.0.0.1:5432/nourishbot_test
      REDIS_URL: redis://127.0.0.1:6379/0
      TELEGRAM_BOT_ENABLED: "false"
      PYTHONPYCACHEPREFIX: /tmp/nourishbot-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app backend/alembic/versions
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
