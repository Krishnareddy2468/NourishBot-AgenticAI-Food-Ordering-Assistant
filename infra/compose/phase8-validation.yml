services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nourishbot
      POSTGRES_PASSWORD: phase8-local-only
      POSTGRES_DB: nourishbot_phase8
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./phase8-init.sql:/docker-entrypoint-initdb.d/phase8-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nourishbot -d nourishbot_phase8"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
